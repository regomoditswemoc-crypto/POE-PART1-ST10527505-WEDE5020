<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enquire Now | Sunrise Bakery</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@300;400;600&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: linear-gradient(135deg, #fff5f5 0%, #ffe4e1 100%);
font-family: 'Open Sans', sans-serif;
color: #5a3e3e;
line-height: 1.6;
min-height: 100vh;
display: flex;
flex-direction: column;
}
.container { width: 90%; max-width: 1100px; margin: 0 auto; padding: 20px 0; }

header {
background-color: rgba(255, 255, 255, 0.85);
padding: 25px 0;
box-shadow: 0 4px 15px rgba(0,0,0,0.05);
margin-bottom: 30px;
}
header h1 {
font-family: 'Playfair Display', serif;
font-size: 2.5rem;
color: #8b3a3a;
text-align: center;
letter-spacing: 2px;
margin-bottom: 15px;
}

nav ul {
list-style: none;
text-align: center;
display: flex;
justify-content: center;
gap: 30px;
flex-wrap: wrap;
}
nav ul li a {
text-decoration: none;
color: #8b3a3a;
font-weight: 600;
font-size: 1.1rem;
transition: color 0.3s ease, transform 0.2s;
display: inline-block;
}
nav ul li a:hover { color: #d9787a; transform: scale(1.05); }

/* ---- FORM PAGE SPECIFIC STYLES ---- */
.content-page {
background: rgba(255, 255, 255, 0.6);
backdrop-filter: blur(5px);
padding: 40px 30px;
border-radius: 30px;
box-shadow: 0 10px 30px rgba(0,0,0,0.05);
margin: 20px auto;
}
.content-page h2 {
font-family: 'Playfair Display', serif;
font-size: 2.2rem;
color: #5a2c2c;
text-align: center;
margin-bottom: 10px;
}
.content-page p {
text-align: center;
margin-bottom: 25px;
}

form {
display: flex;
flex-direction: column;
max-width: 600px;
margin: 0 auto;
}
form label {
margin-top: 15px;
font-weight: 600;
color: #5a2c2c;
}
form input, form select {
padding: 12px;
margin-top: 5px;
border: 1px solid #e0d0d0;
border-radius: 10px;
background-color: #fff;
font-family: 'Open Sans', sans-serif;
width: 100%;
}
form input:focus, form select:focus {
outline: 2px solid #d9787a;
border: none;
}

.cta-button {
display: inline-block;
background-color: #d9787a;
color: #ffffff;
padding: 14px 35px;
text-decoration: none;
border: none;
border-radius: 50px;
font-weight: 600;
font-size: 1.1rem;
box-shadow: 0 4px 15px rgba(217, 120, 122, 0.4);
transition: all 0.3s ease;
margin-top: 25px;
cursor: pointer;
}
.cta-button:hover {
background-color: #c25e60;
transform: translateY(-3px);
}

footer {
background-color: #f5e5e5;
color: #5a3e3e;
text-align: center;
padding: 20px;
margin-top: auto;
border-top: 1px solid #e5d0d0;
}
</style>
</head>
<body>
<header>
<div class="container">
<h1>Sunrise Bakery</h1>
<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About Us</a></li>
<li><a href="services.html">Our Products</a></li>
<li><a href="enquiry.html">Enquire</a></li>
<li><a href="contact.html">Contact Us</a></li>
</ul>
</nav>
</div>
</header>

<main>
<div class="container">
<section class="content-page">
<h2>Request a Custom Cake</h2>
<p>Fill out the form below and we will get back to you with a quote.</p>

<form action="#" method="post">
<label for="name">Full Name:</label>
<input type="text" id="name" name="name" required>

<label for="contact">Contact Number:</label>
<input type="tel" id="contact" name="contact" required>

<label for="type">Cake Type:</label>
<select id="type" name="type">
<option value="birthday">Birthday Cake</option>
<option value="wedding">Wedding Cake</option>
<option value="custom">Custom Design</option>
</select>

<label for="size">Size / Servings:</label>
<input type="text" id="size" name="size" placeholder="e.g. 12 inches / 20 people">

<label for="flavour">Preferred Flavour:</label>
<input type="text" id="flavour" name="flavour">

<label for="date">Date Needed By:</label>
<input type="date" id="date" name="date" required>

<button type="submit" class="cta-button">Send Enquiry</button>
</form>
</section>
</div>
</main>

<footer>
<div class="container">
<p>&copy; 2026 Sunrise Bakery. All rights reserved.</p>
</div>
</footer>
</body>
</html>
